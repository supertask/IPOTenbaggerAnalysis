<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}{% endblock %}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    
    <style>
        body { padding-top: 20px; }
        .chart-container { margin-bottom: 30px; }
        .competitor-badge { margin-right: 5px; margin-bottom: 5px; }
        
        /* コピーボタンのスタイル */
        .copy-button {
            background-color: #ffffff;  /* 白色の背景 */
            border: 2px solid #2ecc71;  /* 緑色の枠線 */
            color: #2ecc71;  /* テキストは緑色 */
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(46, 204, 113, 0.2);
        }
        
        .copy-button:hover {
            background-color: #f8f9fa;  /* 薄いグレー */
            border-color: #27ae60;
            color: #27ae60;
            box-shadow: 0 4px 8px rgba(46, 204, 113, 0.3);
        }
        
        .copy-button:active {
            background-color: #2ecc71;  /* 緑色の背景 */
            border-color: #e9ecef;  /* 灰色の枠線 */
            color: #ffffff;  /* 白色のテキスト */
            box-shadow: 0 2px 4px rgba(46, 204, 113, 0.2);
        }
        
        /* クリック後のアニメーション用クラス */
        .copy-button.clicked {
            background-color: #2ecc71;  /* 緑色の背景 */
            border-color: #e9ecef;  /* 灰色の枠線 */
            color: #ffffff;  /* 白色のテキスト */
            box-shadow: 0 2px 4px rgba(46, 204, 113, 0.2);
        }
        
        /* ローディング状態のスタイル */
        .copy-button.loading {
            background-color: #f8f9fa;  /* 薄いグレー */
            border-color: #2ecc71;  /* 緑色の枠線 */
            color: #2ecc71;  /* テキストは緑色 */
            pointer-events: none;  /* クリックを無効化 */
            opacity: 0.8;
        }
        
        .copy-button.loading .spinner-border {
            width: 1rem;
            height: 1rem;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        .copy-button.loading .original-text {
            display: none;
        }
        
        .copy-button.loading .loading-text {
            display: inline;
        }
        
        .copy-button .loading-text {
            display: none;
        }
        
        /* クリック後の復帰アニメーション用クラス */
        .copy-button.recovering {
            animation: buttonRecoveryEffect 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes buttonRecoveryEffect {
            0% {
                background-color: #2ecc71;  /* 緑色の背景 */
                border-color: #e9ecef;  /* 灰色の枠線 */
                color: #ffffff;  /* 白色のテキスト */
            }
            100% {
                background-color: #ffffff;  /* 白色の背景 */
                border-color: #2ecc71;  /* 緑色の枠線 */
                color: #2ecc71;  /* 緑色のテキスト */
            }
        }
        
        .copy-button i {
            margin-right: 8px;
            font-size: 1.1em;
        }
        
        /* トースト通知のスタイル */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        
        .toast {
            background-color: #2ecc71;  /* ボタンと同じ緑色 */
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 10px;
            opacity: 0;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
            transform: translateY(-10px);
        }
        
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 保有ポートフォリオのラベル */
        .holder-badges {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            vertical-align: middle;
        }

        .holder-badge {
            font-size: 0.7rem;
            font-weight: bold;
            line-height: 1.2;
            padding: 0.2rem 0.45rem;
            border-radius: 0.25rem;
            white-space: nowrap;
            cursor: help;
        }

        .card-header .holder-badges {
            margin-top: 0.35rem;
        }

        h1 .holder-badge {
            font-size: 0.85rem;
            vertical-align: middle;
        }

        /* テンバガー条件のチェックリスト */
        .criteria-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 0.4rem 1.2rem;
        }

        .criteria-item {
            border-radius: 0.25rem;
            border-left: 3px solid transparent;
            overflow: hidden;
        }

        .criteria-toggle {
            display: grid;
            grid-template-columns: 1.4rem minmax(0, 1fr);
            grid-template-areas: "mark title" ".    detail";
            align-items: baseline;
            width: 100%;
            padding: 0.4rem 0.5rem;
            border: 0;
            background: none;
            text-align: left;
            cursor: pointer;
            font: inherit;
            color: inherit;
        }

        .criteria-mark { grid-area: mark; font-weight: bold; }
        .criteria-title { grid-area: title; }
        .criteria-detail {
            grid-area: detail;
            font-size: 0.85rem;
            color: #6c757d;
        }

        .criteria-caret {
            font-size: 0.7rem;
            color: #adb5bd;
            transition: transform 0.15s;
            display: inline-block;
        }
        .criteria-item.is-open .criteria-caret { transform: rotate(180deg); }

        .criteria-more {
            padding: 0 0.5rem 0.6rem 1.9rem;
            font-size: 0.85rem;
            line-height: 1.6;
        }
        .criteria-more .criteria-how { color: #6c757d; }

        .criteria-pass    { border-left-color: #198754; background-color: #f1f8f4; }
        .criteria-pass .criteria-mark { color: #198754; }
        .criteria-partial { border-left-color: #ffc107; background-color: #fffaf0; }
        .criteria-partial .criteria-mark { color: #b8860b; }
        .criteria-fail    { border-left-color: #dc3545; background-color: #fdf3f4; }
        .criteria-fail .criteria-mark { color: #dc3545; }
        .criteria-unknown { border-left-color: #adb5bd; background-color: #f8f9fa; }
        .criteria-unknown .criteria-mark { color: #6c757d; }

        .criteria-required {
            font-size: 0.7rem;
            font-weight: bold;
            color: #fff;
            background-color: #0d6efd;
            border-radius: 0.2rem;
            padding: 0.05rem 0.3rem;
            margin-left: 0.3rem;
            vertical-align: middle;
        }

        /* 一覧カードの条件バッジ */
        .criteria-count-badge {
            font-size: 0.7rem;
            font-weight: bold;
            padding: 0.2rem 0.45rem;
            border-radius: 0.25rem;
            white-space: nowrap;
        }

        /* 株主構成 */
        .shareholder-table td, .shareholder-table th { padding: 0.3rem 0.5rem; }
        .shareholder-table .ratio { text-align: right; white-space: nowrap; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
