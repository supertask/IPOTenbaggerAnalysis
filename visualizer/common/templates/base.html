<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}{% endblock %}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    
    <style>
        body { padding-top: 20px; }
        .chart-container { margin-bottom: 30px; }
        .competitor-badge { margin-right: 5px; margin-bottom: 5px; }
        
        /* コピーボタンのスタイル */
        .copy-button {
            background-color: #ffffff;  /* 白色の背景 */
            border: 2px solid #2ecc71;  /* 緑色の枠線 */
            color: #2ecc71;  /* テキストは緑色 */
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(46, 204, 113, 0.2);
        }
        
        .copy-button:hover {
            background-color: #f8f9fa;  /* 薄いグレー */
            border-color: #27ae60;
            color: #27ae60;
            box-shadow: 0 4px 8px rgba(46, 204, 113, 0.3);
        }
        
        .copy-button:active {
            background-color: #2ecc71;  /* 緑色の背景 */
            border-color: #e9ecef;  /* 灰色の枠線 */
            color: #ffffff;  /* 白色のテキスト */
            box-shadow: 0 2px 4px rgba(46, 204, 113, 0.2);
        }
        
        /* クリック後のアニメーション用クラス */
        .copy-button.clicked {
            background-color: #2ecc71;  /* 緑色の背景 */
            border-color: #e9ecef;  /* 灰色の枠線 */
            color: #ffffff;  /* 白色のテキスト */
            box-shadow: 0 2px 4px rgba(46, 204, 113, 0.2);
        }
        
        /* ローディング状態のスタイル */
        .copy-button.loading {
            background-color: #f8f9fa;  /* 薄いグレー */
            border-color: #2ecc71;  /* 緑色の枠線 */
            color: #2ecc71;  /* テキストは緑色 */
            pointer-events: none;  /* クリックを無効化 */
            opacity: 0.8;
        }
        
        .copy-button.loading .spinner-border {
            width: 1rem;
            height: 1rem;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        .copy-button.loading .original-text {
            display: none;
        }
        
        .copy-button.loading .loading-text {
            display: inline;
        }
        
        .copy-button .loading-text {
            display: none;
        }
        
        /* クリック後の復帰アニメーション用クラス */
        .copy-button.recovering {
            animation: buttonRecoveryEffect 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes buttonRecoveryEffect {
            0% {
                background-color: #2ecc71;  /* 緑色の背景 */
                border-color: #e9ecef;  /* 灰色の枠線 */
                color: #ffffff;  /* 白色のテキスト */
            }
            100% {
                background-color: #ffffff;  /* 白色の背景 */
                border-color: #2ecc71;  /* 緑色の枠線 */
                color: #2ecc71;  /* 緑色のテキスト */
            }
        }
        
        .copy-button i {
            margin-right: 8px;
            font-size: 1.1em;
        }
        
        /* トースト通知のスタイル */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        
        .toast {
            background-color: #2ecc71;  /* ボタンと同じ緑色 */
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 10px;
            opacity: 0;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
            transform: translateY(-10px);
        }
        
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 保有ポートフォリオのラベル */
        .holder-badges {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            vertical-align: middle;
        }

        .holder-badge {
            font-size: 0.7rem;
            font-weight: bold;
            line-height: 1.2;
            padding: 0.2rem 0.45rem;
            border-radius: 0.25rem;
            white-space: nowrap;
            cursor: help;
        }

        /* ポートフォリオ内での比率。ラベルより一段弱く見せる */
        .holder-weight {
            font-weight: normal;
            opacity: 0.85;
            margin-left: 0.1rem;
        }

        .card-header .holder-badges {
            margin-top: 0.35rem;
        }

        h1 .holder-badge {
            font-size: 0.85rem;
            vertical-align: middle;
        }

        /* テンバガー条件のチェックリスト */
        .criteria-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 0.4rem 1.2rem;
        }

        .criteria-item {
            position: relative;
            border-radius: 0.25rem;
            border-left: 3px solid transparent;
            overflow: hidden;
        }

        .criteria-help {
            position: absolute;
            top: 0.35rem;
            right: 0.4rem;
            width: 1.25rem;
            height: 1.25rem;
            padding: 0;
            line-height: 1;
            font-size: 0.75rem;
            border: 1px solid #ced4da;
            border-radius: 50%;
            background: #fff;
            color: #6c757d;
            cursor: help;
        }
        .criteria-help:hover { background: #e9ecef; }

        .criteria-evidence {
            width: 100%;
            font-size: 0.85rem;
            border-collapse: collapse;
        }
        .criteria-evidence th {
            font-weight: normal;
            color: #6c757d;
            padding: 0.1rem 0.6rem 0.1rem 0;
            white-space: nowrap;
            vertical-align: top;
            text-align: left;
        }
        .criteria-evidence td { padding: 0.1rem 0; word-break: break-word; }
        .criteria-why { background: rgba(13, 110, 253, 0.05); }

        .criteria-toggle {
            display: grid;
            grid-template-columns: 1.4rem minmax(0, 1fr);
            grid-template-areas: "mark title" ".    detail";
            align-items: baseline;
            width: 100%;
            padding: 0.4rem 0.5rem;
            border: 0;
            background: none;
            text-align: left;
            cursor: pointer;
            font: inherit;
            color: inherit;
        }

        .criteria-mark { grid-area: mark; font-weight: bold; }
        .criteria-title { grid-area: title; }
        .criteria-detail {
            grid-area: detail;
            font-size: 0.85rem;
            color: #6c757d;
        }

        .criteria-caret {
            font-size: 0.7rem;
            color: #adb5bd;
            transition: transform 0.15s;
            display: inline-block;
        }
        .criteria-item.is-open .criteria-caret { transform: rotate(180deg); }

        .criteria-more {
            padding: 0 0.5rem 0.6rem 1.9rem;
            font-size: 0.85rem;
            line-height: 1.6;
        }
        .criteria-more .criteria-how { color: #6c757d; }

        .criteria-pass    { border-left-color: #198754; background-color: #f1f8f4; }
        .criteria-pass .criteria-mark { color: #198754; }
        .criteria-partial { border-left-color: #ffc107; background-color: #fffaf0; }
        .criteria-partial .criteria-mark { color: #b8860b; }
        .criteria-fail    { border-left-color: #dc3545; background-color: #fdf3f4; }
        .criteria-fail .criteria-mark { color: #dc3545; }
        .criteria-unknown { border-left-color: #adb5bd; background-color: #f8f9fa; }
        .criteria-unknown .criteria-mark { color: #6c757d; }

        .criteria-required {
            font-size: 0.7rem;
            font-weight: bold;
            color: #fff;
            background-color: #0d6efd;
            border-radius: 0.2rem;
            padding: 0.05rem 0.3rem;
            margin-left: 0.3rem;
            vertical-align: middle;
        }

        /* 一覧カードの条件バッジ */
        .criteria-count-badge {
            font-size: 0.7rem;
            font-weight: bold;
            padding: 0.2rem 0.45rem;
            border-radius: 0.25rem;
            white-space: nowrap;
        }

        /* 株主構成 */
        .shareholder-table { font-size: 0.9rem; }
        .shareholder-table td, .shareholder-table th {
            padding: 0.35rem 0.5rem;
            vertical-align: middle;
        }
        /* 株主名だけ折り返す。列幅を指定しないと「（株）花明」が1文字ずつ折れる */
        .shareholder-table .name { width: 100%; word-break: break-word; }
        .shareholder-table .ratio,
        .shareholder-table .lockup { white-space: nowrap; }
        .shareholder-table .ratio { text-align: right; }
        .shareholder-table .bar { width: 1px; padding-right: 0; }
        .shareholder-table .lockup { text-align: right; }

        /* 溝を先に置かないと、名前の列に幅を取られて棒が潰れる */
        .ratio-track {
            display: block;
            width: 88px;
            height: 0.5rem;
            border-radius: 0.25rem;
            background-color: #eceff1;
            overflow: hidden;
        }
        .ratio-bar {
            display: block;
            height: 100%;
            min-width: 2px;
            border-radius: 0.25rem;
            background-color: #90a4ae;
        }
        tbody tr:first-child .ratio-bar { background-color: #546e7a; }

        .lockup-tag {
            font-size: 0.7rem;
            color: #6c757d;
            background-color: #f1f3f5;
            border-radius: 0.25rem;
            padding: 0.1rem 0.35rem;
            white-space: nowrap;
        }

        /* 狭い画面では3列に詰めきれない。株主名を1行目、比率と棒を2行目に置く。
           表のまま列を詰めると、名前が1文字ずつ折り返されて縦に伸びる */
        @media (max-width: 576px) {
            .shareholder-table, .shareholder-table tbody { display: block; }
            .shareholder-table thead { display: none; }
            .shareholder-table tr {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                grid-template-areas: "name ratio" "bar lockup";
                align-items: center;
                gap: 0.2rem 0.6rem;
                padding: 0.5rem 0;
                border-bottom: 1px solid #f1f3f5;
            }
            .shareholder-table td {
                display: block;
                width: auto;
                padding: 0;
                border: 0;
            }
            .shareholder-table .name   { grid-area: name; }
            .shareholder-table .ratio  { grid-area: ratio; font-weight: bold; }
            /* PC側で 1px を指定しているので、ここで戻さないと棒が潰れる */
            .shareholder-table .bar    { grid-area: bar; width: auto; }
            .shareholder-table .lockup { grid-area: lockup; }
            .ratio-track { width: 100%; }
        }

        /* 節ごとの「?」ボタンと、その中身 */
        .section-help {
            width: 1.25rem;
            height: 1.25rem;
            padding: 0;
            margin-left: 0.35rem;
            line-height: 1;
            font-size: 0.75rem;
            vertical-align: middle;
            border: 1px solid #ced4da;
            border-radius: 50%;
            background: #fff;
            color: #6c757d;
            cursor: help;
        }
        .section-help:hover { background: #e9ecef; }
        .section-help.is-open { background: #0d6efd; color: #fff; border-color: #0d6efd; }

        .section-help-panel {
            background: rgba(13, 110, 253, 0.05);
            border: 1px solid rgba(13, 110, 253, 0.15);
            border-radius: 0.25rem;
            padding: 0.6rem 0.8rem;
            margin-bottom: 1rem;
        }
        .help-table { width: 100%; font-size: 0.85rem; border-collapse: collapse; }
        .help-table th {
            width: 9rem;
            font-weight: normal;
            color: #495057;
            text-align: left;
            vertical-align: top;
            padding: 0.2rem 0.7rem 0.2rem 0;
            white-space: nowrap;
        }
        .help-table td { padding: 0.2rem 0; line-height: 1.6; }

        /* スマホでは見出しを上に重ねる。横に並べると本文の幅が無くなる */
        @media (max-width: 576px) {
            .help-table, .help-table tbody, .help-table tr,
            .help-table th, .help-table td { display: block; width: auto; }
            .help-table th {
                white-space: normal;
                font-weight: bold;
                padding: 0.5rem 0 0;
            }
            .help-table tr:first-child th { padding-top: 0; }
        }

        /* 原文の上に置く読み解き。原文と地続きに見えないよう枠で囲う */
        .ai-reading {
            border: 1px solid #ffe08a;
            border-left: 3px solid #ffc107;
            border-radius: 0.25rem;
            background-color: #fffdf5;
            padding: 0.7rem 0.9rem;
        }
        .ai-reading-head {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        /* 総括。判定を目立たせる */
        .judgment-card { border-color: #adb5bd; }
        .judgment-card > .card-header { background-color: #f8f9fa; }
        .judgment-verdict { font-size: 0.85rem; padding: 0.35rem 0.6rem; }

        /* 事業と経営陣の読み解き */
        .profile-list { margin: 0; }
        .profile-list dt {
            font-weight: bold;
            font-size: 0.95rem;
            margin-top: 0.9rem;
            padding-bottom: 0.15rem;
            border-bottom: 1px solid #e9ecef;
        }
        .profile-list dt:first-child { margin-top: 0; }
        .profile-list dd {
            margin: 0.4rem 0 0;
            line-height: 1.75;
        }
        .profile-hint {
            font-weight: normal;
            font-size: 0.75rem;
            color: #adb5bd;
            margin-left: 0.5rem;
        }

        /* 拠点あたりの採算 */
        .facility-table { font-size: 0.88rem; white-space: nowrap; }
        .facility-table td, .facility-table th { padding: 0.3rem 0.5rem; }
        .facility-table .num { text-align: right; }

        /* 持株の推移 */
        .holdings-table { font-size: 0.85rem; white-space: nowrap; }
        .holdings-table td, .holdings-table th { padding: 0.25rem 0.5rem; }
        .holdings-table .num { text-align: right; }
        /* 大きく動いた期のセル。通算だけだと「いつ動いたか」が分からない */
        .holder-moved-down { background-color: #fdecea; color: #b02a37; font-weight: bold; }
        .holder-moved-up   { background-color: #eaf6ec; color: #146c43; font-weight: bold; }

        /* 期中の報告書から取った列。有報の列と見分けが付くようにする */
        .holdings-table .holdings-interim { background-color: #f1f6fb; }
        .holdings-interim-mark {
            font-size: 0.65rem;
            color: #0d6efd;
            border: 1px solid #0d6efd;
            border-radius: 0.2rem;
            padding: 0 0.15rem;
            margin-left: 0.2rem;
            vertical-align: text-top;
        }
        .holdings-table .holder-name {
            max-width: 14rem;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 5%超の株主の売買（大量保有報告書）。理由を読ませたいので折り返す */
        .large-holdings-table { font-size: 0.85rem; }
        .large-holdings-table td, .large-holdings-table th { padding: 0.3rem 0.5rem; }
        .large-holdings-table .num { text-align: right; white-space: nowrap; }
        .large-holdings-table .holder-name { white-space: nowrap; }
        .large-holdings-table .lvh-reason { min-width: 16rem; }
        .lvh-action {
            font-size: 0.65rem;
            border-radius: 0.2rem;
            padding: 0 0.2rem;
            margin-left: 0.25rem;
            vertical-align: text-top;
        }
        .lvh-down { color: #b02a37; background-color: #fdecea; }
        .lvh-up   { color: #146c43; background-color: #eaf6ec; }
        .lvh-flat { color: #6c757d; background-color: #f1f3f5; }
        .lvh-purpose {
            font-size: 0.65rem;
            color: #495057;
            background-color: #f1f3f5;
            border-radius: 0.2rem;
            padding: 0 0.25rem;
            margin-left: 0.25rem;
            white-space: nowrap;
        }
        /* 売買の理由。書類の「増減の内訳」から型に落としたもの */
        .large-holdings-table .lvh-why { white-space: nowrap; }
        .lvh-why-tag {
            font-size: 0.78rem;
            color: #0a3622;
            background-color: #e7f3ec;
            border-radius: 0.25rem;
            padding: 0.05rem 0.35rem;
        }
        .lvh-price { font-size: 0.7rem; color: #6c757d; margin-top: 0.15rem; }
        .lvh-why-text { font-size: 0.75rem; color: #495057; line-height: 1.35; }
        .lvh-contract > summary { font-size: 0.72rem; color: #6c757d; cursor: pointer; }
        .lvh-contract > div { font-size: 0.72rem; color: #495057; line-height: 1.4; }

        /* 同じ時期の適時開示。会社側の説明はここに出る */
        .lvh-disclosure { line-height: 1.35; margin-bottom: 0.15rem; }
        .lvh-disclosure a { font-size: 0.8rem; }
        .lvh-disclosure .text-muted { font-size: 0.7rem; margin-left: 0.25rem; }
        .lvh-count {
            font-size: 0.7rem;
            color: #6c757d;
            background-color: #f1f3f5;
            border-radius: 0.7rem;
            padding: 0 0.35rem;
            margin-left: 0.2rem;
        }
        .lvh-more > summary {
            cursor: pointer;
            font-size: 0.8rem;
            color: #6c757d;
        }
        .lvh-more[open] > summary { margin-bottom: 0.4rem; }

        /* スマホでは6列を横に並べられない。横スクロールにすると開示の文が
           右にはみ出して行だけが間延びするので、1件1カードに畳む */
        @media (max-width: 575.98px) {
            .large-holdings-table thead { display: none; }
            .large-holdings-table, .large-holdings-table tbody { display: block; }
            .large-holdings-table tr {
                display: block;
                padding: 0.5rem 0;
                border-bottom: 1px solid #dee2e6;
            }
            .large-holdings-table td {
                display: block;
                border: 0;
                padding: 0.05rem 0;
                text-align: left !important;
                white-space: normal !important;
            }
            /* 株数・増減・割合は横に並べる。それぞれ1行使うと縦に伸びすぎる */
            .large-holdings-table td.lvh-fig {
                display: inline-block;
                margin-right: 0.9rem;
            }
            .large-holdings-table td[data-label]::before {
                content: attr(data-label);
                color: #6c757d;
                font-size: 0.7rem;
                margin-right: 0.25rem;
            }
            .large-holdings-table .holder-name { font-weight: 600; }
            .large-holdings-table .lvh-reason { margin-top: 0.2rem; }
            .large-holdings-table .lvh-why { white-space: normal; margin-top: 0.2rem; }
            .large-holdings-table .lvh-why .lvh-price { display: inline; margin-left: 0.4rem; }
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // 「?」を押すと、その節がどのデータをどう計算しているかを開く
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.section-help').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var panel = document.getElementById(btn.dataset.help);
                if (!panel) return;
                var open = panel.hasAttribute('hidden');
                if (open) { panel.removeAttribute('hidden'); }
                else { panel.setAttribute('hidden', ''); }
                btn.classList.toggle('is-open', open);
            });
        });
    });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
