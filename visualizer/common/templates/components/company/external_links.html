<!-- 外部リンクセクション -->
{# 会社ホームページとIPOの基礎知識は、コードからURLを組み立てられないので
   データから来る（visualizer/company_links.py）。無い銘柄では出さない #}
<div class="card mb-4">
    <div class="card-header">
        <h5 class="mb-0">外部リンク</h5>
    </div>
    <div class="card-body">
        <div class="row">
            {% for link in (external_links.links if external_links else []) %}
            <div class="col-md-4 col-6 mb-2">
                <a href="{{ link.url }}" target="_blank" rel="noopener"
                   class="btn btn-outline-primary w-100 text-truncate">
                    <i class="bi {{ link.icon }}"></i> {{ link.label }}
                </a>
            </div>
            {% endfor %}
            <div class="col-md-4 col-6 mb-2">
                <a href="https://irbank.net/{{ company_code }}/ir?mw=2" target="_blank" rel="noopener"
                   class="btn btn-outline-primary w-100 text-truncate">
                    <i class="bi bi-graph-up"></i> IRバンク（IR情報）
                </a>
            </div>
            <div class="col-md-4 col-6 mb-2">
                <a href="https://irbank.net/{{ company_code }}/per?mw=2" target="_blank" rel="noopener"
                   class="btn btn-outline-primary w-100 text-truncate">
                    <i class="bi bi-bar-chart-line"></i> IRバンク（PER情報）
                </a>
            </div>
            <div class="col-md-4 col-6 mb-2">
                <a href="https://www.traders.co.jp/ipo/{{ company_code }}" target="_blank" rel="noopener"
                   class="btn btn-outline-primary w-100 text-truncate">
                    <i class="bi bi-building"></i> トレーダーズ（IPO情報）
                </a>
            </div>
        </div>
    </div>
</div>
