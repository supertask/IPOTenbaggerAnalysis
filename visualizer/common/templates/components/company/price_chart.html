{# 株価・出来高・PERの時系列。データはAPIから非同期で取る #}
<div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h5 class="mb-0">株価</h5>
        <div class="btn-group btn-group-sm" role="group" id="price-range-buttons"></div>
    </div>
    <div class="card-body">
        <div id="price-chart-status" class="text-muted small">株価を読み込んでいます...</div>
        <div id="price-chart" style="min-height: 520px; display: none;"></div>
        <div id="price-chart-note" class="text-muted small mt-2" style="display: none;">
            株価・出来高は株式分割を調整済み。PERは終値 ÷ 直近の有価証券報告書の1株当たり当期純利益（実績）で、
            EPSは発表後の分割に合わせて調整しています。<br>
            PER欄の背景は緑が20倍以下、黄が20〜40倍、赤が40倍超。
            オレンジの点線はロックアップ解除の目安（上場30日後・180日後・初値1.5倍到達日）。
            日経平均は凡例をクリックすると表示します。
        </div>
    </div>
</div>

<script>
(function () {
    var CODE = {{ company_code|tojson }};
    var APP = {{ app_type|tojson }};

    // 期間ボタン。添付のチャートに合わせて代表的なレンジを用意する
    var RANGES = [
        { key: '1m',  label: '1ヶ月', days: 31 },
        { key: '3m',  label: '3ヶ月', days: 92 },
        { key: '6m',  label: '6ヶ月', days: 183 },
        { key: '1y',  label: '1年',   days: 365 },
        { key: '3y',  label: '3年',   days: 365 * 3 },
        { key: '5y',  label: '5年',   days: 365 * 5 },
        { key: 'all', label: '全期間', days: null }
    ];

    document.addEventListener('DOMContentLoaded', function () {
        var statusEl = document.getElementById('price-chart-status');
        var chartEl = document.getElementById('price-chart');
        var noteEl = document.getElementById('price-chart-note');
        var buttonsEl = document.getElementById('price-range-buttons');

        fetch('/' + APP + '/api/price_history/' + encodeURIComponent(CODE))
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(function (payload) {
                if (!payload.has_price) {
                    statusEl.textContent = 'この銘柄の株価データを取得できませんでした。';
                    return;
                }
                render(payload);
            })
            .catch(function (err) {
                statusEl.textContent = '株価の取得に失敗しました: ' + err.message;
            });

        function render(payload) {
            var p = payload.prices;
            var dates = p.dates;

            var traces = [{
                type: 'candlestick',
                name: '株価',
                x: dates,
                open: p.open, high: p.high, low: p.low, close: p.close,
                increasing: { line: { color: '#d32f2f' } },
                decreasing: { line: { color: '#1976d2' } },
                xaxis: 'x', yaxis: 'y'
            }, {
                type: 'bar',
                name: '出来高',
                x: dates,
                y: p.volume,
                marker: { color: '#b0a24a' },
                xaxis: 'x', yaxis: 'y2',
                hovertemplate: '出来高 %{y:,}<extra></extra>'
            }];

            if (payload.has_nikkei) {
                // 水準が違うので、表示期間の先頭を100とした指数に直して重ねる
                var base = null;
                var indexed = payload.nikkei.map(function (v) {
                    if (v === null || v === undefined) return null;
                    if (base === null) base = v;
                    return Math.round(v / base * 1000) / 10;
                });
                traces.push({
                    type: 'scatter',
                    mode: 'lines',
                    name: '日経平均（期間先頭=100）',
                    x: dates,
                    y: indexed,
                    line: { color: '#9e9e9e', width: 1, dash: 'dot' },
                    connectgaps: true,
                    visible: 'legendonly',
                    xaxis: 'x', yaxis: 'y4',
                    hovertemplate: '日経平均 %{y:.1f}<extra></extra>'
                });
            }

            // 役員の持株が前期から減った時点。ロックアップの点線と紛れないよう
            // マーカーで置き、凡例で消せるようにする
            if ((payload.insider_sales || []).length) {
                traces.push({
                    type: 'scatter',
                    mode: 'markers',
                    name: '役員の持株が減少',
                    x: payload.insider_sales.map(function (m) { return m.date; }),
                    y: payload.insider_sales.map(function (m) { return m.close; }),
                    text: payload.insider_sales.map(function (m) {
                        return '役員の持株合計 ' + m.diff.toLocaleString() + '株';
                    }),
                    marker: { symbol: 'triangle-down', size: 11, color: '#c2185b' },
                    xaxis: 'x', yaxis: 'y',
                    hovertemplate: '%{text}<extra></extra>'
                });
            }

            if (payload.has_per) {
                traces.push({
                    type: 'scatter',
                    mode: 'lines',
                    name: 'PER（実績）',
                    x: dates,
                    y: payload.per,
                    line: { color: '#7b1fa2', width: 1.5 },
                    connectgaps: false,
                    xaxis: 'x', yaxis: 'y3',
                    hovertemplate: 'PER %{y:.1f}倍<extra></extra>'
                });
            }

            // PERが無い銘柄では下段を作らず、そのぶん株価と出来高を広く使う
            var hasPer = !!payload.has_per;
            var layout = {
                height: 620,
                margin: { l: 20, r: 70, t: 10, b: 30 },
                showlegend: true,
                legend: { orientation: 'h', y: 1.1 },
                hovermode: 'x unified',
                // ドラッグでの移動も切る。データの無い未来側へ動かせてしまうため
                dragmode: false,
                xaxis: {
                    type: 'date',
                    // 目盛りを一番下の段に付ける（既定だと株価と出来高の間に出る）
                    anchor: hasPer ? 'y3' : 'y2',
                    rangeslider: { visible: true, thickness: 0.07 },
                    // 休場日を詰めて、間隔が空かないようにする
                    rangebreaks: [{ bounds: ['sat', 'mon'] }],
                    // データのある範囲の外へは動かせないようにする
                    range: [dates[0], dates[dates.length - 1]]
                },
                yaxis:  {
                    domain: hasPer ? [0.46, 1] : [0.32, 1],
                    title: { text: '株価（円）' }, side: 'right', zeroline: false
                },
                yaxis2: {
                    domain: hasPer ? [0.24, 0.42] : [0.0, 0.28],
                    title: { text: '出来高' }, side: 'right', rangemode: 'tozero'
                }
            };
            if (hasPer) {
                layout.yaxis3 = {
                    domain: [0.0, 0.20], title: { text: 'PER（倍）' }, side: 'right'
                };
            }
            // 日経平均は株価と同じ段に重ねるが、目盛りは出さない
            layout.yaxis4 = {
                domain: layout.yaxis.domain, overlaying: 'y', side: 'left',
                showgrid: false, showticklabels: false, zeroline: false
            };

            layout.shapes = [];
            layout.annotations = [];

            // PERの水準を帯で塗る。20倍以下＝割安、40倍超＝手を出しにくい水準
            if (hasPer) {
                [[0, payload.per_ideal, 'rgba(25,135,84,0.10)'],
                 [payload.per_ideal, payload.per_limit, 'rgba(255,193,7,0.12)'],
                 [payload.per_limit, 100000, 'rgba(220,53,69,0.10)']
                ].forEach(function (band) {
                    layout.shapes.push({
                        type: 'rect', xref: 'paper', yref: 'y3',
                        x0: 0, x1: 1, y0: band[0], y1: band[1],
                        fillcolor: band[2], line: { width: 0 }, layer: 'below'
                    });
                });
            }

            // ロックアップ解除の目安。売りが出やすく、押し目になることもある地点。
            // 日付が近いとラベルが重なるので、短い表記にして高さを段違いにする。
            var lockup = (payload.lockup || []).slice().sort(function (a, b) {
                return a.date < b.date ? -1 : 1;
            });
            lockup.forEach(function (m, i) {
                layout.shapes.push({
                    type: 'line', xref: 'x', yref: 'paper',
                    x0: m.date, x1: m.date, y0: layout.yaxis.domain[0], y1: 1,
                    line: { color: '#fd7e14', width: 1, dash: 'dash' }, layer: 'below'
                });
                // 画面が狭いと日付が離れていてもラベルは重なるので、隣同士は必ず段を変える
                var level = i % 3;
                layout.annotations.push({
                    x: m.date, y: 1 + level * 0.045, xref: 'x', yref: 'paper',
                    text: m.short || m.label, showarrow: false,
                    font: { size: 9, color: '#fd7e14' },
                    yanchor: 'bottom', xanchor: 'left',
                    bgcolor: 'rgba(255,255,255,0.75)',
                    hovertext: m.label, captureevents: true
                });
            });
            if (lockup.length) {
                layout.margin.t = 40;   // ずらしたラベルのぶん上に余白を作る
            }

            // 先に表示しておく。display:none のまま描画すると幅が取れず、
            // Plotlyが既定の700pxで描いて画面からはみ出す。
            statusEl.style.display = 'none';
            chartEl.style.display = '';
            noteEl.style.display = '';

            Plotly.newPlot(chartEl, traces, layout, {
                responsive: true,
                // 期間の指定は下のボタンとレンジスライダーで行う。
                // ホイールや範囲ドラッグでのズームは、データの無い未来まで
                // 動かせてしまうので無効にする。
                scrollZoom: false,
                doubleClick: false,
                displaylogo: false,
                modeBarButtonsToRemove: [
                    'zoom2d', 'pan2d', 'select2d', 'lasso2d',
                    'zoomIn2d', 'zoomOut2d', 'autoScale2d'
                ]
            });

            Plotly.Plots.resize(chartEl);
            buildRangeButtons(payload, dates);
        }

        // 表示中の期間だけを見て縦軸を決める。全期間の高値に引っ張られると
        // 直近の値動きが潰れて読めなくなるため。
        function minMax(values, fromIndex, toIndex) {
            var lo = Infinity, hi = -Infinity;
            for (var i = fromIndex; i <= toIndex; i++) {
                var v = values[i];
                if (v === null || v === undefined) continue;
                if (v < lo) lo = v;
                if (v > hi) hi = v;
            }
            return lo === Infinity ? null : [lo, hi];
        }

        function padded(lo, hi, pad, fromZero) {
            if (fromZero) return [0, hi * (1 + pad) || 1];
            var margin = (hi - lo) * pad || Math.abs(hi) * pad || 1;
            // 株価・PERは負にならないので、下限が0を割らないようにする
            return [Math.max(0, lo - margin), hi + margin];
        }

        function buildRangeButtons(payload, dates) {
            var p = payload.prices;
            var last = new Date(dates[dates.length - 1]);
            var first = new Date(dates[0]);
            var dateMs = dates.map(function (d) { return new Date(d + 'T00:00:00').getTime(); });
            var rescaling = false;

            // 表示範囲に合わせた縦軸を組み立てる
            function yUpdate(fromIndex, toIndex) {
                var update = {};
                var low = minMax(p.low, fromIndex, toIndex);
                var high = minMax(p.high, fromIndex, toIndex);
                if (low && high) update['yaxis.range'] = padded(low[0], high[1], 0.05);

                var vol = minMax(p.volume, fromIndex, toIndex);
                if (vol) update['yaxis2.range'] = padded(vol[0], vol[1], 0.1, true);

                if (payload.has_per) {
                    var per = minMax(payload.per, fromIndex, toIndex);
                    if (per) update['yaxis3.range'] = padded(per[0], per[1], 0.1);
                }
                return update;
            }

            function indexRange(fromMs, toMs) {
                var fromIndex = 0, toIndex = dates.length - 1;
                while (fromIndex < toIndex && dateMs[fromIndex] < fromMs) fromIndex++;
                while (toIndex > fromIndex && dateMs[toIndex] > toMs) toIndex--;
                return [fromIndex, toIndex];
            }

            // レンジスライダーで過去に移動したときも縦軸を合わせ直す。
            // これが無いと、直近の株価に合わせた縦軸のまま昔の安い時期を見ることになり、
            // ローソク足がパネルの外へ出て何も見えなくなる。
            chartEl.on('plotly_relayout', function (ev) {
                if (rescaling) return;
                // ウィンドウのリサイズなど、横軸が動いていないときは何もしない
                var touchedX = Object.keys(ev || {}).some(function (k) {
                    return k.indexOf('xaxis.range') === 0;
                });
                if (!touchedX) return;

                var xr = chartEl.layout.xaxis.range;
                if (!xr) return;
                var span = indexRange(new Date(xr[0]).getTime(), new Date(xr[1]).getTime());
                rescaling = true;
                Plotly.relayout(chartEl, yUpdate(span[0], span[1])).then(function () {
                    rescaling = false;
                }, function () { rescaling = false; });

                // スライダーで範囲を変えたらボタンの選択表示は外す
                buttonsEl.querySelectorAll('button').forEach(function (b) {
                    b.classList.remove('btn-primary');
                    b.classList.add('btn-outline-secondary');
                });
            });

            function apply(range, btn) {
                var fromIndex = 0;
                if (range.days !== null) {
                    var from = new Date(last.getTime() - range.days * 86400000);
                    if (from < first) from = first;
                    var fromStr = from.toISOString().slice(0, 10);
                    while (fromIndex < dates.length - 1 && dates[fromIndex] < fromStr) fromIndex++;
                }
                var toIndex = dates.length - 1;

                var update = yUpdate(fromIndex, toIndex);
                update['xaxis.range'] = [dates[fromIndex], dates[toIndex]];

                rescaling = true;
                Plotly.relayout(chartEl, update).then(function () {
                    rescaling = false;
                }, function () { rescaling = false; });

                buttonsEl.querySelectorAll('button').forEach(function (b) {
                    b.classList.toggle('btn-primary', b === btn);
                    b.classList.toggle('btn-outline-secondary', b !== btn);
                });
            }

            var spanDays = (last - first) / 86400000;
            var defaultBtn = null;
            RANGES.forEach(function (range) {
                // 上場から日が浅い銘柄に長い期間のボタンを出しても意味がない
                if (range.days !== null && range.days > spanDays * 1.5) return;
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn btn-outline-secondary';
                btn.textContent = range.label;
                btn.addEventListener('click', function () { apply(range, btn); });
                buttonsEl.appendChild(btn);
                if (range.key === '1y' || (defaultBtn === null && range.key === 'all')) {
                    defaultBtn = btn;
                    defaultBtn._range = range;
                }
            });
            if (defaultBtn) apply(defaultBtn._range, defaultBtn);
        }
    });
})();
</script>
